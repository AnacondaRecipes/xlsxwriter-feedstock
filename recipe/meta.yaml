{% set name = "XlsxWriter" %}
{% set version = "3.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/jmcnamara/{{ name }}/archive/refs/tags/RELEASE_{{ version }}.tar.gz
  sha256: 7012892e41057fbe474f9b68bb042cd8337760d574dde852bf64fcd769aee36e

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<38]

requirements:
  host:
    - python
    - pip
    - setuptools >=77
  run:
    - python

test:
  source_files:
    - xlsxwriter
  imports:
    - xlsxwriter
  requires:
    - pip
    - pytest
  commands:
    - pip check
    # pyargs does not work, test folder was removed from the site-package dir
    - pytest -vv xlsxwriter/test

about:
  home: https://xlsxwriter.readthedocs.io
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: A Python module for creating Excel XLSX files
  description: |
    XlsxWriter is a Python module that can be used to write text, numbers, formulas
    and hyperlinks to multiple worksheets in an Excel 2007+ XLSX file.
  dev_url: https://github.com/jmcnamara/XlsxWriter
  doc_url: https://xlsxwriter.readthedocs.io

extra:
  recipe-maintainers:
    - mcs07
    - nehaljwani
